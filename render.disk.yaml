services:
  # 1. Morpheus Full-Stack Web Service (Persistent Disk Storage Alternative)
  - type: web
    name: morpheus-ai
    runtime: python
    plan: starter  # Starter required for persistent disks
    region: oregon
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd ../backend && python manage.py collectstatic --noinput
    preDeployCommand: cd backend && python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: morpheus-postgres
          property: connectionString
      - key: USE_S3_STORAGE
        value: "false"
    disk:
      name: morpheus-media
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 1

databases:
  # 2. Managed PostgreSQL with pgvector support
  - name: morpheus-postgres
    plan: starter
    region: oregon
    databaseName: morpheus_db
    user: morpheus_admin

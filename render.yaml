services:
  # 1. Morpheus Full-Stack Web Service (Stateless + Cloudflare R2 Shared Storage)
  - type: web
    name: morpheus-ai
    runtime: python
    plan: starter  # Starter plan supports preDeployCommand and zero spin-downs
    region: oregon
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd ../backend && python manage.py collectstatic --noinput
    preDeployCommand: cd backend && python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: morpheus-postgres
          property: connectionString
      # Cloudflare R2 S3-Compatible Object Storage
      - key: USE_S3_STORAGE
        value: "true"
      - key: AWS_STORAGE_BUCKET_NAME
        value: morpheus-documents
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false

databases:
  # 2. Managed PostgreSQL with pgvector support
  - name: morpheus-postgres
    plan: starter
    region: oregon
    databaseName: morpheus_db
    user: morpheus_admin

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MORPHEUS — Intelligent Campus Assistant{% endblock %}</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN for utility classes in Django templates -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mor: {
              bg: '#FBF8F5',
              surface: '#FFFDFB',
              text: '#241D19',
              coral: '#EA7957',
              sage: '#BDD9B0',
              button: '#35271F'
            }
          },
          fontFamily: {
            heading: ['Manrope', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#FBF8F5] text-[#241D19] font-sans antialiased">
  {% block content %}{% endblock %}

  {% block extra_scripts %}{% endblock %}
</body>
</html>

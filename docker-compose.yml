services:
  # PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: g38_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-g38_db}
      POSTGRES_USER: ${POSTGRES_USER:-g38_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-g38_secure_password_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-g38_user} -d ${POSTGRES_DB:-g38_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django REST Framework Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: g38_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-production-ready-g38-secret-key-replace-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      DATABASE_URL: postgres://${POSTGRES_USER:-g38_user}:${POSTGRES_PASSWORD:-g38_secure_password_2026}@db:5432/${POSTGRES_DB:-g38_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.1-flash-lite}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173}
    volumes:
      - media_storage:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: g38_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  media_storage:
    driver: local
